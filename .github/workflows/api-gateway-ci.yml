name: api-gateway ci

on:
  push:
    branches: [backend, main, master]
    paths:
      - api-gateway/**
      - .github/workflows/api-gateway-ci.yml
  pull_request:
    branches: [backend, main, master]
    paths:
      - api-gateway/**
      - .github/workflows/api-gateway-ci.yml
  workflow_dispatch:

jobs:
  run-api-gateway:
    name: Build and run api-gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build api-gateway
        working-directory: api-gateway
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean package -DskipTests

      - name: Run api-gateway
        working-directory: api-gateway
        run: |
          java -jar target/*.jar \
            --server.port=0 \
            --spring.main.lazy-initialization=true \
            --spring.cloud.config.enabled=false \
            --spring.cloud.bus.enabled=false \
            --eureka.client.enabled=false \
            > app.log 2>&1 &
          APP_PID=$!
          sleep 25
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat app.log
            exit 1
          fi
          echo "api-gateway started successfully"
          kill "$APP_PID"

