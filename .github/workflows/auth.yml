name: auth-service ci

on:
  push:
    branches: [backend, main, master]
    paths:
      - auth-service/**
      - .github/workflows/auth.yml
  pull_request:
    branches: [backend, main, master]
    paths:
      - auth-service/**
      - .github/workflows/auth.yml
  workflow_dispatch:

jobs:
  run-auth-service:
    name: Build and run auth-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build auth-service
        working-directory: auth-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean package -DskipTests

      - name: Run auth-service
        working-directory: auth-service
        run: |
          java -jar target/*.jar \
            --server.port=0 \
            --spring.main.lazy-initialization=true \
            --spring.cloud.config.enabled=false \
            --spring.cloud.bus.enabled=false \
            --eureka.client.enabled=false \
            --spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration \
            > app.log 2>&1 &
          APP_PID=$!
          sleep 25
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat app.log
            exit 1
          fi
          echo "auth-service started successfully"
          kill "$APP_PID"

