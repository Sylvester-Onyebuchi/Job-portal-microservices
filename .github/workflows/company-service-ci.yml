name: Company-Service CI/CD (Local Test)

on:
  push:
    branches: [ "backend"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./company-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give permission to mvnw
        run: chmod +x mvnw

      - name: Run JUnit Tests
        run: ./mvnw test

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.COMPANY_SERVICE_DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./company-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-service:latest