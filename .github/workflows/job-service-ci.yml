name: Job-Service CI/CD

on:
  push:
    branches: ["backend"]
    paths:
      - "job-service/**"
      - ".github/workflows/job-service-ci.yml"

  pull_request:
    branches: ["backend"]
    paths:
      - "job-service/**"
      - ".github/workflows/job-service-ci.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./job-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Run JUnit Tests
        run: ./mvnw test

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Check Docker Username
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "DOCKERHUB_USERNAME is empty"
            exit 1
          fi
          echo "Docker username exists"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/job-service:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/job-service:latest