name: notification-service ci

on:
  push:
    branches: [backend, main, master]
    paths:
      - notification-service/**
      - .github/workflows/notification-service-ci.yml
  pull_request:
    branches: [backend, main, master]
    paths:
      - notification-service/**
      - .github/workflows/notification-service-ci.yml
  workflow_dispatch:

jobs:
  run-notification-service:
    name: Build and run notification-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build notification-service
        working-directory: notification-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean package -DskipTests

      - name: Run notification-service
        working-directory: notification-service
        run: |
          java -jar target/*.jar \
            --server.port=0 \
            --spring.main.lazy-initialization=true \
            --spring.cloud.config.enabled=false \
            --spring.cloud.bus.enabled=false \
            --eureka.client.enabled=false \
            --spring.rabbitmq.listener.simple.auto-startup=false \
            --spring.rabbitmq.listener.direct.auto-startup=false \
            > app.log 2>&1 &
          APP_PID=$!
          sleep 25
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat app.log
            exit 1
          fi
          echo "notification-service started successfully"
          kill "$APP_PID"

