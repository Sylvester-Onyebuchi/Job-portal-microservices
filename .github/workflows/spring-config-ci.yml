name: spring-config ci

on:
  push:
    branches: [backend, main, master]
    paths:
      - spring-config/**
      - .github/workflows/spring-config-ci.yml
  pull_request:
    branches: [backend, main, master]
    paths:
      - spring-config/**
      - .github/workflows/spring-config-ci.yml
  workflow_dispatch:

jobs:
  run-spring-config:
    name: Build and run spring-config
    runs-on: ubuntu-latest

    env:
      EUREKA_DEFAULT_ZONE: http://localhost:8761/eureka/
      SPRING_CONFIG_GIT_DEFAULT_LABEL: main
      SPRING_CONFIG_GIT_URI: https://github.com/Sylvester-Onyebuchi/spring-config-server
      SPRING_CONFIG_RABBITMQ_HOST: localhost
      SPRING_CONFIG_RABBITMQ_PASSWORD: ci
      SPRING_CONFIG_RABBITMQ_PORT: "5671"
      SPRING_CONFIG_RABBITMQ_USERNAME: ci

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build spring-config
        working-directory: spring-config
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean package -Dmaven.test.skip=true

      - name: Run spring-config
        working-directory: spring-config
        run: |
          java -jar target/*.jar \
            --server.port=0 \
            --eureka.client.enabled=false \
            --spring.cloud.bus.enabled=false \
            --spring.cloud.config.server.git.clone-on-start=false \
            > app.log 2>&1 &
          APP_PID=$!
          sleep 25
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat app.log
            exit 1
          fi
          echo "spring-config started successfully"
          kill "$APP_PID"

