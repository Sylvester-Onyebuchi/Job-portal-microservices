name: Spring-Cloud-Config-Server CI/CD(Local Test)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SPRING_CONFIG_RABBITMQ_HOST: ${{ secrets.SPRING_CONFIG_RABBITMQ_HOST }}
      SPRING_CONFIG_RABBITMQ_PORT: ${{ secrets.SPRING_CONFIG_RABBITMQ_PORT }}
      SPRING_CONFIG_RABBITMQ_USERNAME: ${{ secrets.SPRING_CONFIG_RABBITMQ_USERNAME }}
      SPRING_CONFIG_RABBITMQ_PASSWORD: ${{ secrets.SPRING_CONFIG_RABBITMQ_PASSWORD }}
      SPRING_CONFIG_GIT_URI: ${{ secrets.SPRING_CONFIG_GIT_URI }}
      SPRING_CONFIG_GIT_DEFAULT_LABEL: ${{ secrets.SPRING_CONFIG_GIT_DEFAULT_LABEL }}
      EUREKA_DEFAULT_ZONE: ${{ secrets.EUREKA_DEFAULT_ZONE }}
      ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give permission to mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.SPRING_CONFIG_SERVER_DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spring-config-server:1.0.0

