services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth_db
    ports:
      - "5440:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - services-network

  company-postgres:
      image: postgres:16-alpine
      container_name: company_postgres
      environment:
        POSTGRES_USER: ${COMPANY_DB_USER}
        POSTGRES_PASSWORD: ${COMPANY_DB_PASSWORD}
        POSTGRES_DB: company_db
      ports:
        - "5441:5432"
      volumes:
        - company_postgres_data:/var/lib/postgresql/data
      networks:
        - services-network

  job-postgres:
      image: postgres:16-alpine
      container_name: job_postgres
      environment:
        POSTGRES_USER: ${JOB_DB_USER}
        POSTGRES_PASSWORD: ${JOB_DB_PASSWORD}
        POSTGRES_DB: job_db
      ports:
        - "5442:5432"
      volumes:
        - job_postgres_data:/var/lib/postgresql/data
      networks:
        - services-network

  application-postgres:
      image: postgres:16-alpine
      container_name: application_postgres
      environment:
        POSTGRES_USER: ${APPLICATION_DB_USER}
        POSTGRES_PASSWORD: ${APPLICATION_DB_PASSWORD}
        POSTGRES_DB: application_db
      ports:
        - "5443:5432"
      volumes:
        - application_postgres_data:/var/lib/postgresql/data
      networks:
        - services-network


  rabbitmq:
    image: rabbitmq:3-management
    container_name: service_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5671:5672"
      - "15671:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - services-network

  redis:
    image: redis:7.2-alpine
    container_name: service_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - services-network

  redis-ui:
    image: redis/redisinsight:latest
    container_name: service_redis_ui
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - services-network


  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5444:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8079:8080"
    volumes:
      - ./themes:/opt/keycloak/themes
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - services-network


volumes:
  auth_postgres_data:
  company_postgres_data:
  job_postgres_data:
  application_postgres_data:
  rabbitmq_data:
  redis_data:
  keycloak_db_data:
networks:
  services-network:
    driver: bridge